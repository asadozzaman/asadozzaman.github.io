name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild static site
        run: python scripts/build.py
      - name: Validate routes and evidence assets
        run: python scripts/validate.py
      - name: Check generated output is committed
        run: git diff --exit-code -- docs
      - name: Validate browser script syntax
        run: node --check assets/site.js
